<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Laravel Redis Model Cache</title>
  <desc id="desc">A dark technical portfolio banner showing Laravel-inspired red accents, Redis-inspired data structures, and indexed model caching.</desc>
  <defs>
