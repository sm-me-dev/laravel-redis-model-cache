    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff665f"/><stop offset="1" stop-color="#e3342f"/></linearGradient>
    <linearGradient id="redis" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff716d"/><stop offset="1" stop-color="#a91f26"/></linearGradient>
