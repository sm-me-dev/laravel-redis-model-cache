    <text x="0" y="390" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="27">Deterministic, index-aware caching</text>
    <text x="0" y="430" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="27">for high-read Eloquent models.</text>
