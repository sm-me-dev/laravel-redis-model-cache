name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '30 1 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze PHP
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:php"
